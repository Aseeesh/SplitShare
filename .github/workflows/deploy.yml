name: Deploy

# Production pipeline: the CI gates, then migrations, then a deploy to whichever
# target the repo variable DEPLOY_TARGET names (default: vercel-hook), then smoke
# checks against the live URL. Nothing here is provider-specific — that lives in
# scripts/deploy/targets/*.sh — so changing host is a one-variable change.
#
# Switched on by the repo variable DEPLOY_ENABLED=true, so merging this file
# cannot deploy before the target's secrets exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: Production
    env:
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'vercel-hook' }}
      # Migrations run from CI so every target gets them, not just the one whose
      # build command happens to run them.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # Vercel — deploy hook (no token) or API token, depending on the target
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Cloudflare
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      # Where the release is served, for the readiness wait and smoke tests.
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/ops/requirements.txt

      - name: Apply database migrations
        run: pnpm prisma:deploy

      - name: Deploy (${{ env.DEPLOY_TARGET }})
        id: deploy
        run: scripts/deploy/deploy.sh "$DEPLOY_TARGET"

      # A hook returns before the build is done, so wait for the new commit to
      # be the one serving before testing anything.
      - name: Wait for this commit to go live
        run: python scripts/ops/cli.py wait "${{ steps.deploy.outputs.url }}" "$GITHUB_SHA"

      - name: Smoke test
        run: python scripts/ops/cli.py smoke "${{ steps.deploy.outputs.url }}"
