name: Verify & deploy to Cloudflare

# SplitHome CI/CD. Every push to main runs the §41 gates, applies pending
# Prisma migrations to Neon (DIRECT_URL), builds the OpenNext worker and
# deploys it to Cloudflare Workers. GitHub holds the infrastructure secrets
# (Cloudflare token, database and OAuth credentials); wrangler-action pushes
# the worker secrets during the same deploy, so they are never written to
# the repo. `postinstall` runs `prisma generate`, so both generated clients
# exist before typecheck and build.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to Cloudflare Workers (production)
    needs: verify
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_DRIVER: neon
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm prisma:deploy
      - name: Build
        run: pnpm exec opennextjs-cloudflare build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            DATABASE_URL
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            AUTH_SECRET
            EMAIL_API_KEY
            CRON_SECRET
