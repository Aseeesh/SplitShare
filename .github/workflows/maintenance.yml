name: Maintenance

# Scheduled jobs, run from GitHub Actions instead of a hosting platform's cron
# so they survive a change of host. Both call the Python ops toolkit.
#   - purge:  permanently deletes households archived more than 30 days ago
#   - reminders: triggers payment reminders and recurring expenses

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # The live deployment, which may differ from the app's public-facing URL.
      NEXT_PUBLIC_APP_URL: ${{ vars.DEPLOY_URL || vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/ops/requirements.txt
      - name: Purge expired archived households
        run: python scripts/ops/cli.py purge
      - name: Run reminders and recurring expenses
        run: python scripts/ops/cli.py run-cron
